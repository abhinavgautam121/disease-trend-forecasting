[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disease-trend-forecasting"
version = "1.0.0"
description = "Reproducible CDC case forecasting with honest temporal evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<0.15", "streamlit>=1.40,<2", "plotly>=5.24,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "playwright>=1.48,<2"]

[project.scripts]
disease-forecast = "disease_forecasting.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # The formatter handles code; long UI copy remains readable as prose.

